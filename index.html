<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER OS V100</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="matrix"></canvas>

<div id="boot">
  <h1 class="glitch">BOOTING CYBER OS...</h1>
  <p id="bootText"></p>
  <button onclick="startOS()">INIT SYSTEM</button>
</div>

<div id="app" class="hidden">

  <div id="top">
    <span>CYBER OS V100</span>
    <button onclick="toggleFS()">⛶</button>
  </div>

  <div id="terminal"></div>

  <input id="cmd" placeholder="Enter command..." onkeydown="handleCmd(event)">

</div>

<audio id="beep" src="https://assets.mixkit.co/sfx/preview/mixkit-tech-click-1140.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
