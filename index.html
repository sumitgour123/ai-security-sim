<body>

<div id="intro" class="screen active">
  <h1>AI SECURITY SYSTEM</h1>
  <button onclick="start()">Initialize</button>
</div>

<div id="loader" class="screen hidden">
  <div class="circle"></div>
  <p>Loading AI Modules...</p>
</div>

<div id="terminal" class="screen hidden"></div>

<div id="scan" class="screen hidden">
  <h2>Scanning System...</h2>
  <div class="bar"><div id="progress"></div></div>
  <p id="log"></p>
</div>

<div id="alert" class="screen hidden">
  <h1 class="danger">⚠ BREACH DETECTED ⚠</h1>
</div>

<div id="end" class="screen hidden">
  <h1>😂 Simulation Complete</h1>
  <button onclick="location.reload()">Restart</button>
</div>

<script src="script.js"></script>
</body>
