<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Intrusion System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="matrix"></canvas>

<div id="intro" class="screen active">
  <h1>AI SECURITY SYSTEM</h1>
  <button onclick="start()">Initialize</button>
</div>

<div id="terminal" class="screen hidden"></div>

<div id="scan" class="screen hidden">
  <h2>Scanning System...</h2>
  <div class="bar"><div id="progress"></div></div>
  <p id="log"></p>
</div>

<div id="alert" class="screen hidden">
  <h1 class="danger">⚠ SYSTEM BREACHED ⚠</h1>
</div>

<div id="end" class="screen hidden">
  <h1>😂 Simulation Complete</h1>
  <button onclick="location.reload()">Restart</button>
</div>

<script src="script.js"></script>
</body>
</html>
