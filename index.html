<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Security Simulation V5</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="bootScreen">INITIALIZING AI SECURITY CORE...</div>

<div id="overlay">

  <canvas id="matrix"></canvas>

  <div class="container">
    <div class="panel" id="logs"></div>
    <div class="panel" id="ai">AI: Booting...</div>
    <div class="panel" id="alerts">SYSTEM READY</div>
  </div>

  <div id="cameraBox" class="panel hidden">
    <h3>📷 Camera Scan</h3>
    <div id="cameraFeed"></div>
  </div>

  <div id="mapBox" class="panel hidden">
    <h3>🌍 Location Tracking</h3>
    <div id="mapText"></div>
  </div>

  <div id="chatBox" class="hidden">
    <div id="chatHeader">AI CORE</div>
    <div id="chatMessages"></div>
  </div>

</div>

<button id="startBtn">START SYSTEM</button>

<!-- LOCAL SOUND ONLY (no external dependency) -->
<audio id="beep" src="data:audio/mp3;base64,//uQZAAAAAAAAAAAA"></audio>
<audio id="alertSound" src="data:audio/mp3;base64,//uQZAAAAAAAAAAAA"></audio>

<script src="script.js"></script>
</body>
</html>
