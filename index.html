<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Security Simulation</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="overlay">

  <canvas id="matrix"></canvas>

  <div class="container">
    <div class="panel" id="logs"></div>
    <div class="panel" id="ai">AI: Idle...</div>
    <div class="panel" id="alerts">No Threats</div>
  </div>

  <!-- CAMERA -->
  <div id="cameraBox" class="panel hidden">
    <h3>📷 Camera Scan</h3>
    <div id="cameraFeed">Initializing...</div>
  </div>

  <!-- GPS -->
  <div id="mapBox" class="panel hidden">
    <h3>🌍 Tracking Location</h3>
    <div id="mapText">Locating...</div>
  </div>

  <!-- CHAT -->
  <div id="chatBox" class="hidden">
    <div id="chatHeader">⚠ AI Hacker</div>
    <div id="chatMessages"></div>
  </div>

</div>

<button id="startBtn">START SIMULATION</button>

<!-- SOUND -->
<audio id="beep" preload="auto">
  <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
</audio>

<audio id="alertSound" preload="auto">
  <source src="https://assets.mixkit.co/active_storage/sfx/222/222-preview.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
