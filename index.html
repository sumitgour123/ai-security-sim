<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Security Simulation V5</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- BOOT SCREEN -->
<div id="boot">INITIALIZING SYSTEM...</div>

<!-- MAIN OVERLAY -->
<div id="overlay">

  <canvas id="matrix"></canvas>

  <div class="container">
    <div class="panel" id="logs"></div>
    <div class="panel" id="ai">AI: Idle</div>
    <div class="panel" id="alerts">SYSTEM READY</div>
  </div>

  <!-- POPUPS -->
  <div id="cameraBox" class="box hidden">
    📷 Camera Scan<br>
    <div id="cameraFeed"></div>
  </div>

  <div id="mapBox" class="box hidden">
    🌍 Tracking<br>
    <div id="mapText"></div>
  </div>

  <div id="chatBox" class="hidden">
    <div id="chatHeader">AI CORE</div>
    <div id="chatMessages"></div>
  </div>

</div>

<button id="startBtn">START SIMULATION</button>

<audio id="beep"></audio>
<audio id="alert"></audio>

<script src="script.js"></script>
</body>
                    </html>
